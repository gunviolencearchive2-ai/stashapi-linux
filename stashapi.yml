name: "Stash API"
description: "Official plugin API for Stash"
version: "2.4.17"

ui:
  javascript:
    - app.js
  assets:
    /: assets
    /state: .
  csp:
    connect-src:
      - http://localhost:*
      - http://127.0.0.1:*

exec:
  - powershell
  - "-ExecutionPolicy"
  - "Bypass"
  - "-File"
  - "{pluginDir}/bootstrap.ps1"

interface: raw
errLog: none
