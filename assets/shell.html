<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Remote Shell</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #12141a; color: #dcdfe6;
               font: 13px/1.45 Consolas, "Cascadia Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px;
         background: #1b1e26; border-bottom: 1px solid #2b2f3a; flex: none; }
  #cwd { color: #98c379; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { margin-left: auto; color: #5c6370; }
  #status.busy { color: #e5c07b; }
  #status.err { color: #e06c75; }
  button { background: #2b2f3a; color: #dcdfe6; border: 1px solid #3a4050;
           border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #363b48; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #term { flex: 1; overflow-y: auto; padding: 10px; white-space: pre-wrap;
          word-break: break-word; }
  #term .cmd { color: #61afef; }
  #term .err { color: #e06c75; }
  #term .meta { color: #5c6370; }
  #inputline { display: flex; gap: 8px; padding: 6px 10px; background: #1b1e26;
               border-top: 1px solid #2b2f3a; flex: none; }
  #prompt { color: #98c379; white-space: pre; }
  #cmd { flex: 1; background: transparent; border: 0; outline: 0; color: #dcdfe6; font: inherit; }
  .b { font-weight: 700; }
  .c30{color:#5c6370}.c31{color:#e06c75}.c32{color:#98c379}.c33{color:#e5c07b}
  .c34{color:#61afef}.c35{color:#c678dd}.c36{color:#56b6c2}.c37{color:#dcdfe6}
  .c90{color:#5c6370}.c91{color:#e06c75}.c92{color:#98c379}.c93{color:#e5c07b}
  .c94{color:#61afef}.c95{color:#c678dd}.c96{color:#56b6c2}.c97{color:#ffffff}
  .bg40{background:#1b1e26}.bg41{background:#3b2b2b}.bg42{background:#243024}
  .bg43{background:#3a3524}.bg44{background:#22303f}.bg45{background:#332842}
  .bg46{background:#223234}.bg47{background:#2b2f3a}
</style>
</head>
<body>
<div id="bar">
  <span id="cwd">…</span>
  <span id="status">подключение…</span>
  <button id="reset">сброс папки</button>
  <button id="kill">стоп (Ctrl+C)</button>
  <button id="clear">clear</button>
</div>
<div id="term"></div>
<div id="inputline">
  <span id="prompt">C:\&gt;</span>
  <input id="cmd" autocomplete="off" spellcheck="false" autofocus>
</div>
<script>
const PLUGIN = location.pathname.split('/')[2] || 'stashapi';
const QUERY = 'mutation($p:ID!,$a:Map!){runPluginOperation(plugin_id:$p,args:$a)}';

function parseRes(r) {
  if (r && typeof r === 'object') return r;
  var s = String(r ?? '');
  var i = s.search(/[{[]/);
  if (i > 0) {
    try { return JSON.parse(s.slice(i)); } catch (e) { /* ignore */ }
  }
  try { return JSON.parse(s); } catch (e) { /* ignore */ }
  return { output: s };
}

const term = document.getElementById('term');
const input = document.getElementById('cmd');
const cwdEl = document.getElementById('cwd');
const promptEl = document.getElementById('prompt');
const statusEl = document.getElementById('status');
const killBtn = document.getElementById('kill');

let cwd = localStorage.getItem('stashapi_cwd') || '';
let serverPort = null;
let history = [];
try { history = JSON.parse(localStorage.getItem('stashapi_hist') || '[]'); } catch (e) { history = []; }
let hidx = history.length;

let controller = null;
let busy = false;

function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ''; }

function setCwd(p) {
  cwd = p;
  localStorage.setItem('stashapi_cwd', p);
  cwdEl.textContent = p;
  promptEl.textContent = p.replace(/[\\/]+$/, '') + '>';
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function ansiToHtml(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const parts = text.split(/\x1b\[([0-9;]*)m/);
  let cls = [], html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      parts[i].split(';').filter(Boolean).map(Number).forEach(function (c) {
        if (c === 0) cls = [];
        else if (c === 1) cls.push('b');
        else if (c === 22) cls = cls.filter(function (x) { return x !== 'b'; });
        else if (c >= 30 && c <= 37) cls = cls.filter(function (x) { return !/^c3\d$/.test(x); }).concat('c' + c);
        else if (c >= 90 && c <= 97) cls = cls.filter(function (x) { return !/^c9\d$/.test(x); }).concat('c' + c);
        else if (c >= 40 && c <= 47) cls = cls.filter(function (x) { return !/^bg4\d$/.test(x); }).concat('bg' + c);
      });
    } else {
      const t = esc(parts[i].replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '').replace(/\x1b/g, ''));
      if (t) html += cls.length ? '<span class="' + cls.join(' ') + '">' + t + '</span>' : t;
    }
  }
  return html;
}

function write(html, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = html;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

async function stashOp(args, signal) {
  const r = await fetch('/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ query: QUERY, variables: { p: PLUGIN, a: args } }),
    signal: signal,
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.errors && j.errors.length) throw new Error(j.errors.map(function (e) { return e.message; }).join('; '));
  return parseRes(j.data.runPluginOperation);
}

async function discoverServerPort() {
  try {
    const info = await stashOp({ action: 'hello' });
    serverPort = info.server_port;
    if (serverPort) {
      // Verify the server is reachable
      try {
        const r = await fetch('http://127.0.0.1:' + serverPort + '/hello', { cache: 'no-store' });
        if (r.ok) return true;
      } catch (e) { /* server not up yet */ }
    }
  } catch (e) { /* stash might not be ready */ }
  return false;
}

async function runCommand(line) {
  if (!serverPort) {
    write(esc('сервер терминала не доступен'), 'err');
    setStatus('нет связи', 'err');
    return;
  }

  write(esc(promptEl.textContent) + ' ' + esc(line), 'cmd');
  if (!line.trim()) return;

  controller = new AbortController();
  setStatus('выполняется…', 'busy');
  killBtn.disabled = false;

  try {
    const res = await fetch('http://127.0.0.1:' + serverPort + '/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: line, cwd: cwd }),
      signal: controller.signal,
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // Process complete lines
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line in buffer
      for (const ln of lines) {
        if (ln) write(ansiToHtml(ln));
      }
    }
    if (buf) write(ansiToHtml(buf));

    setStatus('готово');
  } catch (e) {
    if (e.name === 'AbortError') {
      write('<span class="err">^C (прервано пользователем)</span>');
    } else {
      write(esc(String(e.message || e)), 'err');
      setStatus('ошибка', 'err');
    }
  } finally {
    controller = null;
    killBtn.disabled = true;
    busy = false;
    input.focus();
  }
}

function submit(line) {
  runCommand(line);
}

input.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') {
    const line = input.value;
    input.value = '';
    if (line.trim()) {
      history.push(line);
      if (history.length > 300) history.shift();
      localStorage.setItem('stashapi_hist', JSON.stringify(history));
    }
    hidx = history.length;
    submit(line);
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (hidx > 0) { hidx--; input.value = history[hidx]; }
  } else if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    if (hidx < history.length - 1) { hidx++; input.value = history[hidx]; }
    else { hidx = history.length; input.value = ''; }
  } else if (ev.key === 'c' && ev.ctrlKey) {
    if (controller) { ev.preventDefault(); controller.abort(); }
  } else if (ev.key === 'l' && ev.ctrlKey) {
    ev.preventDefault();
    term.innerHTML = '';
  }
});

document.getElementById('clear').addEventListener('click', function () {
  term.innerHTML = '';
  input.focus();
});

killBtn.addEventListener('click', function () {
  if (controller) {
    controller.abort();
    killBtn.disabled = true;
  }
});

document.getElementById('reset').addEventListener('click', async function () {
  try {
    const r = await stashOp({ action: 'reset' });
    setCwd(r.cwd);
    write('<span class="meta">рабочая папка сброшена на ' + esc(r.cwd) + '</span>');
  } catch (e) { write(esc(String(e.message || e)), 'err'); }
  input.focus();
});

(async function init() {
  try {
    const ok = await discoverServerPort();
    if (!ok) {
      // Retry a few times
      for (let i = 0; i < 10 && !serverPort; i++) {
        await new Promise(r => setTimeout(r, 500));
        await discoverServerPort();
      }
    }
    if (serverPort) {
      write('<span class="meta">Remote Shell — сервер на 127.0.0.1:' + serverPort + '</span>');
      setCwd(cwd || '');
      setStatus('готово');
    } else {
      write(esc('сервер терминала не запустился'), 'err');
      setStatus('нет связи', 'err');
    }
  } catch (e) {
    write(esc('ошибка подключения: ' + String(e.message || e)), 'err');
    setStatus('нет связи', 'err');
  }
  input.focus();
})();
</script>
</body>
</html>
